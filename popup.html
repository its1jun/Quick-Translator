<!DOCTYPE html>
<meta charset="UTF-8">
<link rel="stylesheet" href="popup.css">

<div class="bar">
  <select id="src"><option value="ko">한국어<option value="en">English<option value="ja">日本語</select>
  <button id="swap" title="Swap languages" aria-label="Swap languages">⇄</button>
  <select id="dst"><option value="ko">한국어<option value="en">English<option value="ja">日本語</select>
  <button id="theme" title="Toggle dark mode" aria-label="Toggle dark mode"><span class="moon">☾</span><span class="sun">☀</span></button>
</div>

<textarea id="input" placeholder="Enter: translate / Shift+Enter: new line"></textarea>

<div class="box" id="box" hidden>
  <div class="head">
    <span><i class="spin"></i><span id="lang"></span></span>
    <button id="copy">Copy</button>
  </div>
  <pre id="out"></pre>
</div>

<script src="popup.js"></script>
